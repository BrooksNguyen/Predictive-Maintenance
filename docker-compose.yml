version: "3.9"

# ============================================================
#  IoT Predictive Maintenance — Docker Compose
# ============================================================
#  Services:
#    1. scylladb        — NoSQL time-series store (CQL-compatible)
#    2. scylla-init     — One-shot init container that runs init.cql
#    3. spark-master    — Apache Spark master node
#    4. spark-worker    — Apache Spark worker node
#    5. iot-simulator   — TCP socket data streamer
#    6. spark-etl       — PySpark Structured Streaming job
#    7. ml-service      — Continuous RUL prediction (XGBoost)
#    8. dashboard       — Streamlit real-time monitoring UI
# ============================================================

services:

  # ── ScyllaDB ──────────────────────────────────────────────
  scylladb:
    image: ${SCYLLA_IMAGE:-scylladb/scylla:5.4}
    container_name: scylladb
    ports:
      - "9042:9042"
    volumes:
      - scylla-data:/var/lib/scylla
    command: --smp 1 --memory 512M --overprovisioned 1
    networks:
      - iot-net
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  # ── ScyllaDB Schema Init (one-shot) ──────────────────────
  scylla-init:
    image: ${SCYLLA_IMAGE:-scylladb/scylla:5.4}
    container_name: scylla-init
    depends_on:
      scylladb:
        condition: service_healthy
    volumes:
      - ./init_db/init.cql:/init.cql
    entrypoint: ["cqlsh", "scylladb", "9042", "-f", "/init.cql"]
    restart: "no"
    networks:
      - iot-net

  # ── Spark Master ──────────────────────────────────────────
  spark-master:
    image: ${SPARK_IMAGE:-bitnami/spark:3.5}
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
    ports:
      - "8080:8080"   # Master Web UI
      - "7077:7077"   # Master RPC
    networks:
      - iot-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Spark Worker ──────────────────────────────────────────
  spark-worker:
    image: ${SPARK_IMAGE:-bitnami/spark:3.5}
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1g
      - SPARK_WORKER_CORES=2
    ports:
      - "8081:8081"   # Worker Web UI
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - iot-net

  # ── IoT Data Simulator ───────────────────────────────────
  iot-simulator:
    build:
      context: ./iot_simulator
      dockerfile: Dockerfile
    container_name: iot-simulator
    ports:
      - "9999:9999"
    networks:
      - iot-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',9999)); s.close()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── PySpark Streaming ETL ────────────────────────────────
  spark-etl:
    build:
      context: ./spark_etl
      dockerfile: Dockerfile
    container_name: spark-etl
    depends_on:
      scylla-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_started
      iot-simulator:
        condition: service_healthy
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SIMULATOR_HOST=iot-simulator
      - SIMULATOR_PORT=9999
      - SCYLLA_HOST=scylladb
      - SCYLLA_PORT=9042
      - SCYLLA_KEYSPACE=iot_maintenance
      - SCYLLA_TABLE=sensor_readings
    networks:
      - iot-net

  # ── ML Inference Service ─────────────────────────────────
  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: ml-service
    depends_on:
      scylla-init:
        condition: service_completed_successfully
    volumes:
      - ./ml_training/models:/app/models:ro
    environment:
      - SCYLLA_HOST=scylladb
      - SCYLLA_PORT=9042
      - SCYLLA_KEYSPACE=iot_maintenance
      - POLL_INTERVAL=5
      - MODEL_DIR=/app/models
    networks:
      - iot-net
    restart: on-failure

  # ── Streamlit Dashboard ──────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    ports:
      - "8501:8501"
    depends_on:
      scylla-init:
        condition: service_completed_successfully
    environment:
      - SCYLLA_HOST=scylladb
      - SCYLLA_PORT=9042
      - SCYLLA_KEYSPACE=iot_maintenance
    networks:
      - iot-net

# ── Shared Resources ────────────────────────────────────────
volumes:
  scylla-data:

networks:
  iot-net:
    driver: bridge
